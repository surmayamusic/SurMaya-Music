<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SurMaya Music — Dil Se Suno</title>
<style
 /* ═══════════════════════════════════════
   SURMAYA MUSIC — PREMIUM LUXURY THEME
   White • Gold • Multicolor • Cinematic
═══════════════════════════════════════ */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  color: #21182d;
  min-height: 100vh;
  background: #fffaf2;
  overflow-x: hidden;
}

/* Ambient multicolor light */
body::before,
body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.25;
  z-index: -1;
}

body::before {
  width: 430px;
  height: 430px;
  left: -160px;
  top: 80px;
  background: #ff55b4;
}

body::after {
  width: 470px;
  height: 470px;
  right: -170px;
  top: 250px;
  background: #45dfff;
}

.cinematic {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -2;
  background:
    radial-gradient(
      circle at 50% 0%,
      #f1c75a55,
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 100%,
      #c6a5ff22,
      transparent 40%
    ),
    linear-gradient(
      125deg,
      #fffaf2,
      #ffffff 48%,
      #f7f0ff
    );
}

/* ═══════════════════════════════════════
   HEADER & NAVIGATION
═══════════════════════════════════════ */

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #fffffff0;
  backdrop-filter: blur(22px);
  border-bottom: 1px solid #c9a45b55;
}

.nav {
  width: 94%;
  max-width: 1500px;
  min-height: 76px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  color: #21182d;
  font-weight: 800;
}

.brand img {
  width: 49px;
  height: 49px;
  object-fit: contain;
  filter: drop-shadow(0 0 14px #d7a43b66);
}

.brand span {
  font-size: 18px;
  letter-spacing: -0.3px;
}

nav {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}

nav a {
  color: #49394f;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: 0.2s;
}

nav a:hover {
  color: #b47c18;
}

.nav-btn {
  cursor: pointer;
  padding: 9px 15px;
  border-radius: 999px;
  border: 1px solid #b58a3c66;
  background: #ffffff;
  color: #50391c;
  font-weight: 600;
}

.nav-btn:hover {
  background: #fff1cf;
}

.admin-badge {
  font-size: 10px;
  padding: 5px 9px;
  border-radius: 999px;
  background: #f4c95d44;
  color: #93630b;
  font-weight: bold;
}

/* ═══════════════════════════════════════
   HERO SECTION
═══════════════════════════════════════ */

.hero {
  width: 92%;
  max-width: 1200px;
  margin: auto;
  text-align: center;
  padding: 88px 0 75px;
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 30px;
  transform: translateX(-50%);
  width: 500px;
  height: 250px;
  background: radial-gradient(
    ellipse,
    #e6b74d55,
    transparent 70%
  );
  filter: blur(15px);
  z-index: -1;
}

.hero-logo {
  width: 150px;
  height: 150px;
  object-fit: contain;
  filter:
    drop-shadow(0 0 20px #d7a43b55)
    drop-shadow(0 0 40px #ff6ec733);
}

.kicker {
  margin-top: 20px;
  color: #a17b36;
  font-size: 12px;
  letter-spacing: 5px;
  text-transform: uppercase;
  font-weight: 700;
}

h1 {
  font-size: clamp(44px, 7vw, 82px);
  line-height: 1.05;
  margin-top: 12px;
  letter-spacing: -2px;
}

.gradient {
  background: linear-gradient(
    90deg,
    #b47718,
    #ed4ca8,
    #8061e9,
    #08b9d9,
    #b47718
  );
  background-size: 250% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 7s linear infinite;
}

@keyframes shine {
  to {
    background-position: 250% center;
  }
}

.hero p {
  max-width: 680px;
  margin: 22px auto;
  color: #75697f;
  line-height: 1.8;
  font-size: 17px;
}

.btn,
.primary {
  display: inline-block;
  padding: 14px 28px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    #d59b32,
    #e94ba6,
    #7463e8
  );
  color: #ffffff;
  text-decoration: none;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 12px 35px #b4771830;
  transition: 0.25s;
}

.btn:hover,
.primary:hover {
  transform: translateY(-3px);
  filter: brightness(1.08);
  box-shadow: 0 15px 40px #b4771845;
}

/* ═══════════════════════════════════════
   GENERAL SECTIONS
═══════════════════════════════════════ */

.section {
  width: 96%;
  max-width: 1500px;
  margin: auto;
  padding: 38px 0 70px;
}

.section h2 {
  font-size: 30px;
  color: #261c32;
  letter-spacing: -0.5px;
}

.section-sub {
  color: #8c8095;
  font-size: 14px;
  margin-top: 7px;
}

/* ═══════════════════════════════════════
   SEARCH
═══════════════════════════════════════ */

.search-wrap {
  width: min(700px, 94%);
  margin: 28px auto;
}

.search {
  width: 100%;
  padding: 15px 20px;
  border-radius: 999px;
  border: 1px solid #cbb77d88;
  background: #ffffffdd;
  color: #33263f;
  outline: none;
  font-size: 14px;
  box-shadow: 0 5px 25px #8d6c3210;
  transition: 0.2s;
}

.search::placeholder {
  color: #a79aac;
}

.search:focus {
  border-color: #b98a36;
  box-shadow: 0 0 0 4px #d7ad4b22;
}

/* ═══════════════════════════════════════
   MUSIC CARDS
═══════════════════════════════════════ */

.song-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 16px;
}

.song-card {
  min-width: 0;
  padding: 11px;
  border-radius: 20px;
  background: linear-gradient(
    145deg,
    #ffffffef,
    #fff8ec
  );
  border: 1px solid #d9bd7b66;
  box-shadow: 0 18px 45px #8d6c3215;
  transition: 0.25s;
}

.song-card:hover {
  transform: translateY(-6px);
  border-color: #d9a33d;
  box-shadow:
    0 22px 55px #8d6c3225,
    0 0 25px #e5b54b18;
}

/* Colorful album cover */
.cover {
  width: 100%;
  height: 160px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 15% 20%,
      #ff8dc9,
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 25%,
      #68e6ff,
      transparent 35%
    ),
    radial-gradient(
      circle at 55% 90%,
      #b2a0ff,
      transparent 40%
    ),
    #fff0cb;
}

.cover img {
  width: 72%;
  height: 72%;
  object-fit: contain;
  filter: drop-shadow(0 0 18px #ffffff);
}

.song-title {
  font-size: 14px;
  font-weight: 800;
  margin: 11px 2px 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #2b2036;
}

.artist {
  color: #96899f;
  font-size: 11px;
  margin: 0 2px 9px;
}

audio {
  width: 100%;
  height: 34px;
}

/* ═══════════════════════════════════════
   ACTION BUTTONS
═══════════════════════════════════════ */

.actions {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.fav,
.delete {
  flex: 1;
  border: 1px solid #cbb77d66;
  border-radius: 9px;
  padding: 8px;
  background: #fff8e8;
  color: #5c4522;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.fav:hover {
  background: #ffe4f2;
  border-color: #e85ca1;
}

.fav.active {
  background: #ff72b533;
  border-color: #e85ca1;
  color: #a32365;
}

.delete {
  background: #ff3c4615;
  color: #a5262e;
}

.delete:hover {
  background: #ff3c4628;
}

.download {
  display: block;
  text-align: center;
  text-decoration: none;
  margin-top: 7px;
  padding: 8px;
  border-radius: 9px;
  background: linear-gradient(
    90deg,
    #f5e6c5,
    #f4dff0
  );
  border: 1px solid #d6b66b55;
  color: #55402d;
  font-size: 12px;
  transition: 0.2s;
}

.download:hover {
  background: linear-gradient(
    90deg,
    #f2d69b,
    #f2c8e4
  );
}

/* ═══════════════════════════════════════
   PANELS / ABOUT / UPLOAD
═══════════════════════════════════════ */

.panel,
.about,
.upload {
  width: 94%;
  max-width: 950px;
  margin: 10px auto 70px;
  padding: 32px;
  border-radius: 26px;
  background: #ffffffd9;
  border: 1px solid #d9bd7b66;
  box-shadow: 0 20px 60px #8d6c3215;
  backdrop-filter: blur(18px);
}

.about {
  text-align: center;
}

.about img {
  width: 95px;
  height: 95px;
  object-fit: contain;
  filter: drop-shadow(0 0 18px #d7a43b55);
}

.about h2 {
  margin-top: 10px;
  color: #2b2036;
}

.about p {
  color: #776b83;
  line-height: 1.8;
  margin-top: 10px;
}

.upload h2 {
  color: #2b2036;
}

.upload-text {
  color: #96899f;
  font-size: 14px;
  margin-top: 8px;
}

.upload input {
  width: 100%;
  margin: 20px 0;
  color: #777;
}

.upload button {
  border: 0;
  color: #fff;
  padding: 12px 22px;
  border-radius: 999px;
  background: linear-gradient(
    90deg,
    #d59b32,
    #e94ba6,
    #7463e8
  );
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.upload button:hover {
  filter: brightness(1.08);
  transform: translateY(-2px);
}

/* ═══════════════════════════════════════
   FOOTER
═══════════════════════════════════════ */

footer {
  border-top: 1px solid #d9bd7b55;
  text-align: center;
  padding: 28px;
  color: #95899f;
  font-size: 13px;
  background: #ffffff66;
}

.no-results {
  display: none;
  text-align: center;
  color: #95899f;
  padding: 40px;
}

/* ═══════════════════════════════════════
   RESPONSIVE DESIGN
═══════════════════════════════════════ */

@media (max-width: 1100px) {
  .song-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (max-width: 750px) {
  .song-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .hero {
    padding-top: 65px;
  }
}

@media (max-width: 600px) {
  .nav {
    min-height: 62px;
  }

  .brand img {
    width: 40px;
    height: 40px;
  }

  .brand span {
    font-size: 15px;
  }

  nav {
    gap: 8px;
  }

  nav a {
    font-size: 10px;
  }

  .hero {
    padding-top: 55px;
  }

  .hero-logo {
    width: 105px;
    height: 105px;
  }

  .kicker {
    font-size: 9px;
    letter-spacing: 3px;
  }

  h1 {
    font-size: 42px;
    letter-spacing: -1px;
  }

  .hero p {
    font-size: 14px;
  }

  .song-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .song-card {
    padding: 7px;
    border-radius: 15px;
  }

  .cover {
    height: 105px;
  }

  .song-title {
    font-size: 10px;
  }

  .artist {
    font-size: 8px;
  }

  .fav,
  .delete,
  .download {
    font-size: 9px;
    padding: 6px 3px;
  }

  .panel,
  .about,
  .upload {
    padding: 23px 18px;
  }
</style></head>
<body><div class="cinematic"></div>
<header><div class="nav"><a href="#home" class="brand"><img src="{{ url_for('logo') }}" alt="SurMaya Music"><span>SurMaya Music</span></a><nav><a href="#home">Home</a><a href="#music">Music</a><a href="#about">About</a>{% if user and not user.is_admin %}<a href="#favourites">❤️ Favourites</a>{% endif %}{% if user %}<button class="nav-btn" onclick="logoutUser()">Logout</button>{% else %}<a href="#account">Sign In</a>{% endif %}{% if user and user.is_admin %}<span class="admin-badge">ADMIN</span>{% endif %}</nav></div></header>
<main id="home"><section class="hero"><img class="hero-logo" src="{{ url_for('logo') }}" alt="SurMaya Music"><div class="kicker">SurMaya Music • Dil Se Suno</div><h1>Listen. <span class="gradient">Feel. Repeat.</span></h1><p>Original sounds, fresh voices and cinematic music — made to be heard <b>Dil Se</b>.</p><a href="#music" class="btn">Explore Music</a></section>
<section class="section" id="music"><h2>Latest Music</h2><div class="section-sub">Discover the SurMaya sound.</div><div class="search-wrap"><input id="songSearch" class="search" type="search" placeholder="Search your favourite song..."></div><div class="song-grid" id="songGrid">{% for song in songs %}<article class="song-card" data-song="{{ song|lower }}"><div class="cover"><img src="{{ url_for('logo') }}" alt="SurMaya"></div><div class="song-title" title="{{ song }}">{{ song }}</div><div class="artist">SurMaya Music</div><audio controls preload="none"><source src="{{ url_for('songs', filename=song) }}"></audio><a class="download" href="{{ url_for('download_song', filename=song) }}">⬇ Download</a>{% if user and not user.is_admin %}<div class="actions"><button class="fav" data-song="{{ song }}" onclick="toggleFavourite(this)">♡ Favourite</button></div>{% endif %}{% if user and user.is_admin %}<div class="actions"><form method="POST" action="{{ url_for('delete_song', filename=song) }}" style="width:100%" onsubmit="return confirm('Delete this song?')"><button class="delete" type="submit" style="width:100%">🗑️ Delete</button></form></div>{% endif %}</article>{% endfor %}</div><div id="noResults" class="no-results">No matching song found.</div></section>
{% if user and not user.is_admin %}<section class="section" id="favourites"><h2>❤️ My Favourites</h2><div class="section-sub">Your saved SurMaya songs.</div><div class="song-grid" id="favGrid"></div><div id="noFav" class="no-results">You haven't added any favourites yet.</div></section>{% endif %}
{% if not user %}<section class="panel" id="account"><h2>👤 Join SurMaya Music</h2><p>Sign in to save favourites, or create your free account.</p>{% if request.args.get('auth_error') %}<div class="error">{{ request.args.get('auth_error') }}</div>{% endif %}<div class="auth-tabs"><button id="loginTab" class="tab active" onclick="showAuth('login')">Sign In</button><button id="signupTab" class="tab" onclick="showAuth('signup')">Create Account</button></div><form id="loginForm" class="form auth-form" method="POST" action="{{ url_for('login') }}"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><button class="primary" type="submit">Sign In</button></form><form id="signupForm" class="form auth-form hidden" method="POST" action="{{ url_for('signup') }}"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" minlength="6" placeholder="Password (6+ characters)" required><button class="primary" type="submit">Create Account</button></form></section>{% endif %}
<section class="about" id="about"><img src="{{ url_for('logo') }}" alt="SurMaya Music"><h2>SurMaya Music</h2><p><b>Dil Se Suno.</b> SurMaya Music is a growing music platform focused on sound, emotion and new creative voices.</p><p>CEO of SurMaya Music — <b>Aayush Raj</b></p></section>{% if user and user.is_admin %}<section class="upload"><h2>👑 Admin — Upload Music</h2><div class="upload-text">Only the admin account can add new tracks.</div><form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data"><input type="file" name="song" accept=".mp3,.wav,.ogg" required><button type="submit">Upload Song</button></form></section>{% endif %}</main><footer>© 2026 SurMaya Music • Dil Se Suno</footer>
<script>const search=document.getElementById('songSearch'),cards=[...document.querySelectorAll('.song-card')],noResults=document.getElementById('noResults');if(search){search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();let n=0;cards.forEach(c=>{const ok=c.dataset.song.includes(q);c.style.display=ok?'':'none';if(ok)n++});noResults.style.display=n?'none':'block'})}function showAuth(type){const login=document.getElementById('loginForm'),signup=document.getElementById('signupForm'),lt=document.getElementById('loginTab'),st=document.getElementById('signupTab');if(type==='signup'){login.classList.add('hidden');signup.classList.remove('hidden');lt.classList.remove('active');st.classList.add('active')}else{signup.classList.add('hidden');login.classList.remove('hidden');st.classList.remove('active');lt.classList.add('active')}}const initialTab='{{ request.args.get("auth_tab", "login") }}';if(initialTab==='signup')showAuth('signup');function logoutUser(){window.location.href='{{ url_for("logout") }}'}async function toggleFavourite(button){const song=button.dataset.song,active=button.classList.contains('active'),endpoint=active?'/api/favourite/remove':'/api/favourite';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({song_name:song})});if(!r.ok){alert('Please sign in first.');return}button.classList.toggle('active');button.textContent=button.classList.contains('active')?'♥ Favourite':'♡ Favourite';loadFavourites()}catch(e){alert('Something went wrong.')}}async function loadFavourites(){const grid=document.getElementById('favGrid');if(!grid)return;try{const r=await fetch('/api/favourites'),names=await r.json(),set=new Set(names.map(x=>x.toLowerCase()));cards.forEach(c=>{const b=c.querySelector('.fav');if(b){const on=set.has(b.dataset.song.toLowerCase());b.classList.toggle('active',on);b.textContent=on?'♥ Favourite':'♡ Favourite'}});grid.innerHTML='';names.forEach(name=>{const o=cards.find(c=>c.dataset.song===name.toLowerCase());if(o){const c=o.cloneNode(true),b=c.querySelector('.fav');if(b){b.classList.add('active');b.textContent='♥ Favourite'}grid.appendChild(c)}});const nf=document.getElementById('noFav');if(nf)nf.style.display=names.length?'none':'block'}catch(e){console.log(e)}}{% if user and not user.is_admin %}loadFavourites();{% endif %}</script></body></html>
